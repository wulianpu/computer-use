name: validate

# Portable CI (design doc v2): validates the Agent Plugins package, the
# projected official Skill, the raw upstream source hashes, the projection
# integrity (regeneration equality + receipts), lint/format, and runs unit
# tests plus the fake-MCP tests. It installs NO Cua and touches NO desktop —
# live qualification (mcp_probe, Calculator E2E, desktop matrix) runs on a
# dedicated interactive qualification host, never here.
#
# Supply chain: actions are pinned to full commit SHAs at current stable
# majors; Python dev dependencies are locked (uv.lock) and installed with
# --locked; nothing is upgraded implicitly at run time. Python *dependencies*
# are reproducibly locked; the GitHub-hosted runner image itself is not
# bit-reproducible (pinned to ubuntu-24.04 to bound the drift).
#
# Pushing a v* tag additionally runs scripts/release_check.py — the
# server-side release gate — before the release is published.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        run: python -m pip install "uv==0.12.5"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check scripts tests

      - name: Format check (ruff format)
        run: uv run ruff format --check scripts tests

      - name: Deterministic plugin + skill validation (Level 1)
        run: uv run python scripts/validate_plugin.py

      - name: Upstream source verification, offline (Level 1)
        run: uv run python scripts/verify_upstream.py

      - name: Projection verification, offline (Level 1)
        run: uv run python scripts/verify_projection.py

      # NOTE: skills-ref (the Agent Skills reference implementation) is NOT
      # run here — it is demonstration software, not a production library,
      # and is not reliably installable from PyPI. Our deterministic
      # validators above are the gate; a skills-ref cross-check can be run
      # manually on a machine where it is available.

      - name: Unit tests + fake MCP server tests (Level 1)
        run: uv run python -m pytest -v

  release-check:
    # Server-side release gate for pushed version tags: the same
    # machine-provable acceptance list that must pass locally before push.
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # actions/checkout v7.0.1 — full history: release_check walks git
      # ancestry from the tested qualification commit to the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        run: python -m pip install "uv==0.12.5"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Release tag points at current origin/main
        run: |
          git fetch origin main
          TAG_SHA=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} must point at the validated main lineage (current origin/main: ${MAIN_SHA})"
            exit 1
          fi

      - name: Machine release gate (release_check.py)
        run: uv run python scripts/release_check.py --tag "${GITHUB_REF_NAME}"

      - name: Release gate summary
        if: success()
        run: echo "RELEASE READY confirmed server-side for ${GITHUB_REF_NAME}; publish the GitHub Release with the CHANGELOG notes."
