name: validate

# Portable CI (design doc v2): validates the Agent Plugins package, the
# projected official Skill, the raw upstream source hashes, the projection
# integrity (regeneration equality + receipts), lint/format, and runs unit
# tests plus the fake-MCP tests. It installs NO Cua and touches NO desktop —
# live qualification (mcp_probe, Calculator E2E, desktop matrix) runs on a
# dedicated interactive qualification host, never here.
#
# Supply chain: actions are pinned to full commit SHAs; Python dev
# dependencies are locked (uv.lock) and installed with --locked; nothing is
# upgraded implicitly at run time.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4.2.1
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install uv (pinned)
        run: python -m pip install "uv==0.12.5"

      - name: Install locked development dependencies
        run: uv sync --locked --extra dev

      - name: Lint (ruff check)
        run: uv run ruff check scripts tests

      - name: Format check (ruff format)
        run: uv run ruff format --check scripts tests

      - name: Deterministic plugin + skill validation (Level 1)
        run: uv run python scripts/validate_plugin.py

      - name: Upstream source verification, offline (Level 1)
        run: uv run python scripts/verify_upstream.py

      - name: Projection verification, offline (Level 1)
        run: uv run python scripts/verify_projection.py

      # NOTE: skills-ref (the Agent Skills reference implementation) is NOT
      # run here — it is demonstration software, not a production library,
      # and is not reliably installable from PyPI. Our deterministic
      # validators above are the gate; a skills-ref cross-check can be run
      # manually on a machine where it is available.

      - name: Unit tests + fake MCP server tests (Level 1)
        run: uv run python -m pytest -v
