name: validate

# Portable CI (design doc v2): validates the Agent Plugins package, the
# projected official Skill, the raw upstream source hashes, the projection
# integrity (regeneration equality + receipts), and runs unit tests plus
# the fake-MCP tests. It installs NO Cua and touches NO desktop — live
# qualification (mcp_probe, Calculator E2E, desktop matrix) runs on a
# dedicated interactive qualification host, never here.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Deterministic plugin + skill validation (Level 1)
        run: python scripts/validate_plugin.py

      - name: Upstream source verification, offline (Level 1)
        run: python scripts/verify_upstream.py

      - name: Projection verification, offline (Level 1)
        run: python scripts/verify_projection.py

      # NOTE: skills-ref (the Agent Skills reference implementation) is NOT
      # run here — it is demonstration software, not a production library,
      # and is not reliably installable from PyPI. Our deterministic
      # validators above are the gate; a skills-ref cross-check can be run
      # manually on a machine where it is available.

      - name: Unit tests + fake MCP server tests (Level 1)
        run: python -m pytest -v
